name: CI

on:
  push:
    branches:
      - main
      - agent/**
      - task/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify & Test Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint codebase
        run: npm run lint

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

      - name: Build workspaces
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Start isolated MongoDB replica set
        run: |
          docker run -d --name roundset-auth-mongo -p 127.0.0.1:27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec roundset-auth-mongo mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)'; then break; fi
            sleep 2
          done
          docker exec roundset-auth-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            if docker exec roundset-auth-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Test password auth on real MongoDB replica set
        env:
          RUN_AUTH_REPLICA_TESTS: "true"
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/roundset_test?replicaSet=rs0
        run: npx --no-install vitest run apps/api/tests/p2-auth-03b-live-mongodb.integration.test.ts

      - name: Re-run existing identity and OTP integration suites
        env:
          RUN_LIVE_MONGODB_TESTS: "true"
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/roundset_test?replicaSet=rs0
        run: |
          # The legacy preservation test expects a pre-existing collection.
          # Seed only the disposable CI container, never an external database.
          docker exec roundset-auth-mongo mongosh --quiet --eval 'db.getSiblingDB("roundset_test").smoke_test.insertOne({_id:"ci-smoke-preservation"})'
          npx --no-install vitest run apps/api/tests/identity-live-mongodb.integration.test.ts
          npx --no-install vitest run apps/api/tests/p2-auth-04a-live-mongodb.integration.test.ts
          docker exec roundset-auth-mongo mongosh --quiet --eval 'quit(db.getSiblingDB("roundset_test").smoke_test.countDocuments({_id:"ci-smoke-preservation"}) === 1 ? 0 : 1)'

      - name: Remove disposable MongoDB
        if: always()
        run: |
          if docker inspect roundset-auth-mongo >/dev/null 2>&1; then docker rm -f -v roundset-auth-mongo; fi

  audit-all-dependencies:
    name: Audit all dependencies (including development)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm audit --include=dev --json

  sharp-compatibility-spike:
    name: Temporary sharp security compatibility experiment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Resolve scoped override using npm (no repository writes)
        run: |
          cp package-lock.json /tmp/roundset-lock-before.json
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.overrides={...p.overrides,"@huggingface/transformers@3.8.1":{"sharp":"0.35.5"}}; fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module -e 'import fs from "node:fs"; const a=JSON.parse(fs.readFileSync("/tmp/roundset-lock-before.json","utf8")),b=JSON.parse(fs.readFileSync("package-lock.json","utf8")); const changed=Object.fromEntries(Object.entries(b.packages).filter(([k,v])=>JSON.stringify(v)!==JSON.stringify(a.packages[k]))); const removed=Object.keys(a.packages).filter(k=>!(k in b.packages)); console.log("LOCK_DELTA "+JSON.stringify({changed,removed}));'
      - run: npm ci
      - run: npm ls sharp @huggingface/transformers kokoro-js
      - run: npm audit --include=dev
      - name: Exercise patched native module and Transformers import
        run: |
          node --input-type=module -e 'import sharp from "sharp"; import {env} from "@huggingface/transformers"; const result=await sharp({create:{width:2,height:2,channels:3,background:"white"}}).png().toBuffer(); if(result.length===0||!env)throw Error("Dependency smoke test failed"); console.log("sharp version:",sharp.versions.sharp)'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
